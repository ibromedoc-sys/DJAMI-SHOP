name: Build DJAMI SHOP APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: debug sans signature, ou release avec secrets de signature
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "setuptools<70"
          python -m pip install "buildozer==1.5.0"
          python -m pip install "kivy==2.3.0" "kivymd==2.0.0"
       

      - name: Clean everything
        run: |
          rm -rf .buildozer
          rm -rf bin
    
      - name: Vérifier Cython
        run: |
          cython --version
          python -c "import Cython; print(Cython.__version__)"
      - name: Restore signing keystore
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" \
            && test -n "$ANDROID_KEYSTORE_PASSWORD" \
            && test -n "$ANDROID_KEY_ALIAS" \
            && test -n "$ANDROID_KEY_PASSWORD" \
            || { echo "::error::Configurez les quatre secrets Android de signature."; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/djami-shop-upload.keystore"
          chmod 600 "$RUNNER_TEMP/djami-shop-upload.keystore"

      - name: Build debug APK
        if: github.event_name == 'push' || inputs.build_type == 'debug'
        run: buildozer -v android debug

      - name: Upload debug APK
        if: github.event_name == 'push' || inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: DJAMI-SHOP-Android-Debug-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Build signed release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        env:
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/djami-shop-upload.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          buildozer -v android release

      - name: Upload signed release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: DJAMI-SHOP-Android-Release-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Remove signing keystore
        if: always() && github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        run: rm -f "$RUNNER_TEMP/djami-shop-upload.keystore"